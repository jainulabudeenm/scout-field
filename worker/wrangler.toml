name = "scout-field"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Reference library files are imported as plain strings at build time.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
PROVIDER = "gemini"

# Secrets (never in this file):
#   wrangler secret put SCOUT_ACCESS_CODE
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY
