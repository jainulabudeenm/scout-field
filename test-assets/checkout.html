<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;font:400 15px/1.4 -apple-system,system-ui,sans-serif;background:#fff;color:#111}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600}
.nav{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #eee}
.nav h1{font-size:17px;font-weight:600}
.nav .x{margin-left:auto;width:20px;height:20px;color:#bbb;font-size:15px;text-align:center;line-height:20px}
.body{padding:20px 16px}
.lead{font-size:13px;color:#adadad;margin-bottom:20px}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f2f2f2;font-size:14px}
.row .k{color:#b2b2b2}
.total{display:flex;justify-content:space-between;padding:14px 0;font-weight:700;font-size:16px}
.field{margin:18px 0}
.field input{width:100%;padding:12px;border:1px solid #e2e2e2;border-radius:6px;font-size:15px}
.field input::placeholder{color:#999}
.err{color:#d33;font-size:12px;margin-top:5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-right:6px}
.chips{display:flex;gap:6px;margin:16px 0}
.chip{padding:5px 10px;border:1px solid #e2e2e2;border-radius:14px;font-size:12px;color:#999}
.cta{display:flex;gap:8px;position:absolute;bottom:0;left:0;right:0;padding:12px 16px}
.cta button{flex:1;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:600}
.pay{background:#0b6;color:#fff}
.cancel{background:#e33;color:#fff}
.tiny{position:absolute;bottom:74px;right:16px;font-size:10px;color:#c8c8c8}
</style></head><body>
<div class="status"><span>9:41</span><span>5G ▪ 82%</span></div>
<div class="nav"><h1>Checkout</h1><div class="x">×</div></div>
<div class="body">
  <p class="lead">Review your order before you continue. ERR_CODE 4012 may appear.</p>
  <div class="row"><span class="k">Item subtotal</span><span>₹1,240</span></div>
  <div class="row"><span class="k">Convenience</span><span>₹49</span></div>
  <div class="row"><span class="k">Svc. chg.</span><span>₹22</span></div>
  <div class="total"><span>Total</span><span>₹1,311</span></div>
  <div class="chips"><span class="chip">Express</span><span class="chip">Gift wrap</span><span class="chip">Save card</span></div>
  <div class="field">
    <input placeholder="Card number">
    <div class="err">Invalid input</div>
  </div>
  <div class="field"><input placeholder="Promo code"></div>
  <p style="font-size:13px"><span class="dot"></span>Delivery slot confirmed</p>
</div>
<div class="tiny">By continuing you accept the terms</div>
<div class="cta"><button class="cancel">Cancel</button><button class="pay">Pay ₹1,311</button></div>
</body></html>
